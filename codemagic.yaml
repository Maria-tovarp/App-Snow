workflows:
  ios-unsigned:
    name: Snow iOS sin firma
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      groups:
        - snow_env
      flutter: stable
      xcode: latest
      cocoapods: default

    scripts:
      - name: Crear archivo .env
        script: |
          cd "$CM_BUILD_DIR"

          if [ -z "$SUPABASE_URL" ]; then
            echo "ERROR: falta SUPABASE_URL"
            exit 1
          fi

          if [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "ERROR: falta SUPABASE_ANON_KEY"
            exit 1
          fi

          printf 'SUPABASE_URL=%s\nSUPABASE_ANON_KEY=%s\n' \
            "$SUPABASE_URL" \
            "$SUPABASE_ANON_KEY" > .env

          echo "Archivo .env creado correctamente"

      - name: Obtener dependencias Flutter
        script: |
          cd "$CM_BUILD_DIR"
          flutter pub get

      - name: Instalar CocoaPods
        script: |
          cd "$CM_BUILD_DIR/ios"
          pod install

      - name: Compilar iOS sin firma en Release
        script: |
          cd "$CM_BUILD_DIR"
          flutter build ios --release --no-codesign

      - name: Crear IPA sin firma
        script: |
          cd "$CM_BUILD_DIR/build/ios/iphoneos"

          rm -rf Payload
          rm -f Snow-unsigned.ipa

          mkdir Payload
          cp -R Runner.app Payload/

          ditto -c -k \
            --sequesterRsrc \
            --keepParent \
            Payload \
            Snow-unsigned.ipa

          echo "IPA sin firma creado correctamente"

    artifacts:
      - build/ios/iphoneos/Snow-unsigned.ipa
      - build/ios/iphoneos/Runner.app
      - /tmp/xcodebuild_logs/*.log